spring:
  application:
    name: mtr-backend
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: true
  datasource:
    url: jdbc:mysql://localhost:3306/mtrmap
    username: mtrmap
    password: mtrmap
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

logging:
  level:
    org.flywaydb: DEBUG
